<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>🌴 Chennai Chronicles - Tamil Open World</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #0a0a1a; display: flex; justify-content: center; align-items: center; min-height: 100vh; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; overflow: hidden; }
  #game-container { width: 100%; max-width: 900px; position: relative; background: #1a1a2e; border-radius: 12px; overflow: hidden; box-shadow: 0 10px 40px rgba(0,0,0,0.5); }
  canvas { display: block; width: 100%; height: auto; background: #2d5016; }
  @keyframes fadeInOut {
    0% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
    20% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    80% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    100% { opacity: 0; transform: translate(-50%, -50%) scale(0.8); }
  }
</style>
</head>
<body>

<div id="game-container">
  <canvas id="gameCanvas"></canvas>
  
  <div id="ui-layer" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none;">
    <div style="display: flex; justify-content: space-between; padding: 10px; background: linear-gradient(to bottom, rgba(0,0,0,0.7), transparent); color: white; font-size: 14px;">
      <div style="display: flex; gap: 15px; align-items: center;">
        <span id="time-display" style="font-weight: bold; color: #ffd700;">☀️ காலை 6:00</span>
        <span style="color: #90EE90;">₹<span id="money">100</span></span>
        <span style="color: #ff6b6b;">⚡ <span id="energy">100</span>%</span>
      </div>
      <div style="display: flex; gap: 10px;">
        <button onclick="toggleQuests()" style="pointer-events: auto; background: #e94560; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold;">📜 Quests</button>
        <button onclick="toggleInventory()" style="pointer-events: auto; background: #0f3460; border: none; color: white; padding: 6px 12px; border-radius: 6px; font-size: 12px; cursor: pointer; font-weight: bold;">🎒 Bag</button>
      </div>
    </div>
    
    <div id="dialog-box" style="display: none; position: absolute; bottom: 80px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 500px; background: rgba(20, 20, 40, 0.95); border: 2px solid #e94560; border-radius: 12px; padding: 15px; color: white; pointer-events: auto;">
      <div id="dialog-speaker" style="color: #ffd700; font-weight: bold; margin-bottom: 5px; font-size: 16px;"></div>
      <div id="dialog-text" style="font-size: 15px; line-height: 1.5; margin-bottom: 10px;"></div>
      <div id="dialog-translation" style="font-size: 13px; color: #aaa; font-style: italic; margin-bottom: 10px;"></div>
      <button onclick="advanceDialog()" style="background: #e94560; border: none; color: white; padding: 8px 20px; border-radius: 6px; cursor: pointer; font-weight: bold; float: right;">Next ➜</button>
    </div>
    
    <div id="quest-panel" style="display: none; position: absolute; top: 50px; right: 10px; width: 280px; background: rgba(10, 10, 30, 0.95); border: 2px solid #ffd700; border-radius: 12px; padding: 15px; color: white; pointer-events: auto; max-height: 300px; overflow-y: auto;">
      <h3 style="margin: 0 0 10px 0; color: #ffd700; border-bottom: 1px solid #444; padding-bottom: 5px;">📜 Quests</h3>
      <div id="quest-list"></div>
      <button onclick="toggleQuests()" style="margin-top: 10px; background: #444; border: none; color: white; padding: 5px 15px; border-radius: 4px; cursor: pointer; width: 100%;">Close</button>
    </div>
    
    <div id="inv-panel" style="display: none; position: absolute; top: 50px; right: 10px; width: 250px; background: rgba(10, 10, 30, 0.95); border: 2px solid #0f3460; border-radius: 12px; padding: 15px; color: white; pointer-events: auto;">
      <h3 style="margin: 0 0 10px 0; color: #90EE90; border-bottom: 1px solid #444; padding-bottom: 5px;">🎒 Inventory</h3>
      <div id="inv-list" style="font-size: 14px;"></div>
      <button onclick="toggleInventory()" style="margin-top: 10px; background: #444; border: none; color: white; padding: 5px 15px; border-radius: 4px; cursor: pointer; width: 100%;">Close</button>
    </div>
    
    <div id="notification" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(233, 69, 96, 0.95); color: white; padding: 15px 30px; border-radius: 8px; font-weight: bold; font-size: 16px; pointer-events: none; animation: fadeInOut 2s;"></div>
    
    <div id="mobile-controls" style="position: absolute; bottom: 20px; width: 100%; display: none; justify-content: space-between; padding: 0 20px; box-sizing: border-box; pointer-events: none;">
      <div style="position: relative; width: 120px; height: 120px; pointer-events: auto;">
        <button ontouchstart="setDir('up')" onmousedown="setDir('up')" onmouseup="clearDir()" ontouchend="clearDir()" style="position: absolute; top: 0; left: 40px; width: 40px; height: 40px; background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 8px; color: white; font-size: 20px;">▲</button>
        <button ontouchstart="setDir('left')" onmousedown="setDir('left')" onmouseup="clearDir()" ontouchend="clearDir()" style="position: absolute; top: 40px; left: 0; width: 40px; height: 40px; background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 8px; color: white; font-size: 20px;">◀</button>
        <button ontouchstart="setDir('right')" onmousedown="setDir('right')" onmouseup="clearDir()" ontouchend="clearDir()" style="position: absolute; top: 40px; left: 80px; width: 40px; height: 40px; background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 8px; color: white; font-size: 20px;">▶</button>
        <button ontouchstart="setDir('down')" onmousedown="setDir('down')" onmouseup="clearDir()" ontouchend="clearDir()" style="position: absolute; top: 80px; left: 40px; width: 40px; height: 40px; background: rgba(255,255,255,0.3); border: 2px solid white; border-radius: 8px; color: white; font-size: 20px;">▼</button>
      </div>
      <button ontouchstart="doAction()" onmousedown="doAction()" style="width: 70px; height: 70px; border-radius: 50%; background: rgba(233, 69, 96, 0.6); border: 3px solid #e94560; color: white; font-weight: bold; font-size: 14px; pointer-events: auto; align-self: flex-end;">E</button>
    </div>
    
    <div id="location-label" style="position: absolute; bottom: 20px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.6); color: #ffd700; padding: 5px 15px; border-radius: 20px; font-size: 14px; font-weight: bold; pointer-events: none; opacity: 0; transition: opacity 0.5s;"></div>
  </div>
  
  <div id="start-screen" style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%); display: flex; flex-direction: column; align-items: center; justify-content: center; color: white; z-index: 100;">
    <h1 style="font-size: 42px; margin-bottom: 10px; color: #ffd700; text-shadow: 2px 2px 4px rgba(0,0,0,0.5); text-align: center;">🌴 Chennai Chronicles</h1>
    <p style="font-size: 18px; color: #e94560; margin-bottom: 5px; font-weight: bold;">சென்னை கதைகள்</p>
    <p style="font-size: 14px; color: #aaa; margin-bottom: 30px; text-align: center; max-width: 400px; padding: 0 20px;">Explore the open world of a Tamil city. Visit temples, drink filter coffee, ride autos, and complete quests!</p>
    <div style="display: flex; gap: 10px; margin-bottom: 20px; flex-wrap: wrap; justify-content: center;">
      <span style="background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 15px; font-size: 12px;">WASD / Arrow Keys</span>
      <span style="background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 15px; font-size: 12px;">E to Interact</span>
      <span style="background: rgba(255,255,255,0.1); padding: 5px 12px; border-radius: 15px; font-size: 12px;">Touch Controls</span>
    </div>
    <button onclick="startGame()" style="background: #e94560; border: none; color: white; padding: 15px 50px; border-radius: 30px; font-size: 20px; font-weight: bold; cursor: pointer; box-shadow: 0 5px 20px rgba(233,69,96,0.4);">▶ Start Adventure</button>
    <p style="margin-top: 20px; font-size: 12px; color: #666;">Works on all devices • No installation needed</p>
  </div>
</div>

<script>
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

function resizeCanvas() {
  const container = document.getElementById('game-container');
  canvas.width = container.clientWidth;
  canvas.height = Math.min(window.innerHeight * 0.85, 650);
}
resizeCanvas();
window.addEventListener('resize', resizeCanvas);

const TILE_SIZE = 48;
const MAP_W = 60;
const MAP_H = 60;
const PLAYER_SPEED = 3;
const TILES = { ROAD: 0, BUILDING: 1, WATER: 2, SAND: 3, GRASS: 4, TEMPLE: 5, TREE: 6, MARKET: 7, STATION: 8, TEASTALL: 9, PARK: 10, WALL: 11 };
const COLORS = { [TILES.ROAD]: '#555555', [TILES.BUILDING]: '#8B4513', [TILES.WATER]: '#1E90FF', [TILES.SAND]: '#F4A460', [TILES.GRASS]: '#228B22', [TILES.TEMPLE]: '#FF6347', [TILES.TREE]: '#006400', [TILES.MARKET]: '#FF8C00', [TILES.STATION]: '#696969', [TILES.TEASTALL]: '#D2691E', [TILES.PARK]: '#32CD32', [TILES.WALL]: '#444444' };

let gameRunning = false;
let player = { x: 30*TILE_SIZE, y: 30*TILE_SIZE, dir: 'down', moving: false, frame: 0 };
let camera = { x: 0, y: 0 };
let keys = {};
let touchDir = null;
let map = [];
let npcs = [];
let items = [];
let quests = [];
let inventory = {};
let gameTime = 6 * 60;
let money = 100;
let energy = 100;
let dialogQueue = [];
let inDialog = false;
let currentLocation = "";
let particles = [];

function generateMap() {
  map = [];
  for(let y=0; y<MAP_H; y++) {
    map[y] = [];
    for(let x=0; x<MAP_W; x++) map[y][x] = TILES.GRASS;
  }
  for(let i=0; i<MAP_W; i++) {
    map[8][i] = TILES.ROAD; map[15][i] = TILES.ROAD; map[25][i] = TILES.ROAD;
    map[35][i] = TILES.ROAD; map[45][i] = TILES.ROAD; map[55][i] = TILES.ROAD;
  }
  for(let i=0; i<MAP_H; i++) {
    map[i][5] = TILES.ROAD; map[i][15] = TILES.ROAD; map[i][25] = TILES.ROAD;
    map[i][35] = TILES.ROAD; map[i][45] = TILES.ROAD; map[i][55] = TILES.ROAD;
  }
  for(let y=0; y<8; y++) for(let x=0; x<MAP_W; x++) map[y][x] = TILES.SAND;
  for(let y=0; y<5; y++) for(let x=0; x<MAP_W; x++) map[y][x] = TILES.WATER;
  
  for(let y=20; y<28; y++) for(let x=8; x<16; x++) {
    if(y===20 || y===27 || x===8 || x===15) map[y][x] = TILES.TEMPLE;
    else map[y][x] = TILES.ROAD;
  }
  map[23][11] = TILES.TEMPLE; map[23][12] = TILES.TEMPLE; map[24][11] = TILES.TEMPLE; map[24][12] = TILES.TEMPLE;
  
  for(let y=22; y<32; y++) for(let x=38; x<48; x++) {
    if((x+y)%3 === 0) map[y][x] = TILES.MARKET; else map[y][x] = TILES.ROAD;
  }
  
  for(let y=42; y<50; y++) for(let x=40; x<52; x++) {
    if(y===42 || y===49 || x===40 || x===51) map[y][x] = TILES.STATION;
    else map[y][x] = TILES.ROAD;
  }
  
  map[16][16] = TILES.TEASTALL; map[35][26] = TILES.TEASTALL; map[15][46] = TILES.TEASTALL;
  
  for(let y=35; y<45; y++) for(let x=8; x<18; x++) map[y][x] = TILES.PARK;
  for(let y=36; y<44; y+=2) for(let x=9; x<17; x+=2) map[y][x] = TILES.TREE;
  
  for(let i=0; i<80; i++) {
    let bx = Math.floor(Math.random() * (MAP_W-4)) + 2;
    let by = Math.floor(Math.random() * (MAP_H-4)) + 2;
    if(map[by][bx] === TILES.GRASS) {
      map[by][bx] = TILES.BUILDING;
      if(Math.random() > 0.5) map[by][bx+1] = TILES.BUILDING;
      if(Math.random() > 0.5) map[by+1][bx] = TILES.BUILDING;
    }
  }
  for(let i=0; i<60; i++) {
    let tx = Math.floor(Math.random() * MAP_W);
    let ty = Math.floor(Math.random() * MAP_H);
    if(map[ty][tx] === TILES.GRASS) map[ty][tx] = TILES.TREE;
  }
}

function createNPCs() {
  npcs = [
    { x: 12*TILE_SIZE, y: 24*TILE_SIZE, name: "குருக்கள் (Priest)", dialog: [{ text: "வணக்கம்! கோயிலுக்கு வரவேற்கிறோம்.", trans: "Welcome to the temple!" }, { text: "மலர் வாங்கி பிரார்த்தனை செய்யுங்கள்.", trans: "Buy flowers and offer your prayers." }], quest: "temple_prayer", color: '#FF6347', sprite: '👴' },
    { x: 17*TILE_SIZE, y: 16*TILE_SIZE, name: "தோட்டக்காரர் (Tea Master)", dialog: [{ text: "என்னண்ணே! ஒரு ஃபில்டர் காபியா?", trans: "Brother! A filter coffee?" }, { text: "எங்க காபி உலகப் புகழ்பெற்றது!", trans: "Our coffee is world famous!" }], shop: "coffee", color: '#D2691E', sprite: '☕' },
    { x: 43*TILE_SIZE, y: 27*TILE_SIZE, name: "பூ வியாபாரி (Flower Seller)", dialog: [{ text: "மல்லிகைப் பூ வேணுமா?", trans: "Want jasmine flowers?" }, { text: "கோயிலுக்கு மாலை கட்டித் தரேன்!", trans: "I'll make a garland for the temple!" }], shop: "flowers", color: '#FF69B4', sprite: '🌸' },
    { x: 46*TILE_SIZE, y: 46*TILE_SIZE, name: "ஆட்டோ ஓட்டுநர் (Auto Driver)", dialog: [{ text: "எங்க போகணும் சார்?", trans: "Where to, sir?" }, { text: "மீட்டர் போட்டு வரேன்!", trans: "I'll put the meter on!" }], service: "auto", color: '#FFD700', sprite: '🛺' },
    { x: 25*TILE_SIZE, y: 10*TILE_SIZE, name: "மீனவர் (Fisherman)", dialog: [{ text: "கடல் இன்று அமைதியாக இருக்கு.", trans: "The sea is calm today." }, { text: "மெரினா கடற்கரையில் நடந்து போங்க!", trans: "Take a walk on Marina Beach!" }], quest: "beach_walk", color: '#4682B4', sprite: '🎣' },
    { x: 42*TILE_SIZE, y: 38*TILE_SIZE, name: "பயணி (Traveler)", dialog: [{ text: "சென்ட்ரல் ஸ்டேஷன் எங்க இருக்கு?", trans: "Where is Central Station?" }, { text: "தெற்கே போனால் கிடைக்கும்.", trans: "Go south to find it." }], color: '#9370DB', sprite: '🎒' },
    { x: 13*TILE_SIZE, y: 40*TILE_SIZE, name: "பூங்கா காப்பாளர் (Park Keeper)", dialog: [{ text: "இங்கே மரங்களை பாதுகாக்கிறோம்.", trans: "We protect the trees here." }, { text: "இயற்கையை ரசியுங்கள்!", trans: "Enjoy nature!" }], quest: "park_visit", color: '#228B22', sprite: '🌳' },
    { x: 36*TILE_SIZE, y: 26*TILE_SIZE, name: "இட்லி கடைக்காரர் (Idli Master)", dialog: [{ text: "காலை இட்லி சூடா இருக்கு!", trans: "Morning idlis are hot!" }, { text: "சாம்பாரோட சாப்பிடுங்க!", trans: "Eat it with sambar!" }], shop: "idli", color: '#F5DEB3', sprite: '🍽️' }
  ];
}

function createItems() {
  items = [
    { x: 20*TILE_SIZE, y: 20*TILE_SIZE, name: "ஃபில்டர் காபி", nameEn: "Filter Coffee", icon: "☕", value: 15 },
    { x: 44*TILE_SIZE, y: 28*TILE_SIZE, name: "மல்லிகை மாலை", nameEn: "Jasmine Garland", icon: "🌸", value: 20 },
    { x: 14*TILE_SIZE, y: 38*TILE_SIZE, name: "இட்லி", nameEn: "Idli", icon: "🍚", value: 10 },
    { x: 30*TILE_SIZE, y: 15*TILE_SIZE, name: "தேநீர்", nameEn: "Tea", icon: "🍵", value: 10 },
    { x: 10*TILE_SIZE, y: 10*TILE_SIZE, name: "கடல் சிப்பி", nameEn: "Sea Shell", icon: "🐚", value: 5 },
    { x: 50*TILE_SIZE, y: 50*TILE_SIZE, name: "ரயில் டிக்கெட்", nameEn: "Train Ticket", icon: "🎫", value: 25 },
  ];
}

function initQuests() {
  quests = [
    { id: "first_coffee", title: "Morning Filter Coffee", desc: "Visit the tea stall and get coffee", completed: false, reward: 50 },
    { id: "temple_prayer", title: "Temple Visit", desc: "Go to the temple and offer prayers", completed: false, reward: 100 },
    { id: "beach_walk", title: "Marina Beach", desc: "Walk along the beach", completed: false, reward: 75 },
    { id: "market_visit", title: "T. Nagar Shopping", desc: "Visit the market area", completed: false, reward: 60 },
    { id: "park_visit", title: "Park Relaxation", desc: "Spend time in the park", completed: false, reward: 40 },
    { id: "station_visit", title: "Central Station", desc: "Visit the railway station", completed: false, reward: 80 },
  ];
}

window.addEventListener('keydown', e => { keys[e.key.toLowerCase()] = true; if(e.key.toLowerCase() === 'e') doAction(); });
window.addEventListener('keyup', e => keys[e.key.toLowerCase()] = false);
function setDir(dir) { touchDir = dir; }
function clearDir() { touchDir = null; }

if('ontouchstart' in window || navigator.maxTouchPoints > 0) {
  document.getElementById('mobile-controls').style.display = 'flex';
}

function update() {
  if(!gameRunning || inDialog) return;
  gameTime += 0.05;
  if(gameTime >= 24*60) gameTime = 0;
  if(player.moving && energy > 0) energy -= 0.02;
  if(energy < 100 && !player.moving) energy += 0.05;
  
  let dx = 0, dy = 0;
  if(keys['w'] || keys['arrowup'] || touchDir === 'up') { dy = -PLAYER_SPEED; player.dir = 'up'; }
  if(keys['s'] || keys['arrowdown'] || touchDir === 'down') { dy = PLAYER_SPEED; player.dir = 'down'; }
  if(keys['a'] || keys['arrowleft'] || touchDir === 'left') { dx = -PLAYER_SPEED; player.dir = 'left'; }
  if(keys['d'] || keys['arrowright'] || touchDir === 'right') { dx = PLAYER_SPEED; player.dir = 'right'; }
  
  player.moving = (dx !== 0 || dy !== 0);
  if(player.moving) player.frame += 0.15;
  
  let newX = player.x + dx;
  let newY = player.y + dy;
  let tx = Math.floor((newX + TILE_SIZE/2) / TILE_SIZE);
  let ty = Math.floor((newY + TILE_SIZE/2) / TILE_SIZE);
  
  if(tx >= 0 && tx < MAP_W && ty >= 0 && ty < MAP_H) {
    let tile = map[ty][tx];
    if(tile !== TILES.BUILDING && tile !== TILES.TEMPLE && tile !== TILES.WALL && tile !== TILES.TREE && tile !== TILES.WATER && tile !== TILES.STATION) {
      player.x = newX; player.y = newY;
    }
  }
  
  camera.x = player.x - canvas.width/2 + TILE_SIZE/2;
  camera.y = player.y - canvas.height/2 + TILE_SIZE/2;
  camera.x = Math.max(0, Math.min(camera.x, MAP_W*TILE_SIZE - canvas.width));
  camera.y = Math.max(0, Math.min(camera.y, MAP_H*TILE_SIZE - canvas.height));
  
  let px = Math.floor(player.x / TILE_SIZE);
  let py = Math.floor(player.y / TILE_SIZE);
  let loc = "";
  if(py < 8) loc = "🏖️ Marina Beach";
  else if(px > 8 && px < 16 && py > 20 && py < 28) loc = "🛕 Temple";
  else if(px > 38 && px < 48 && py > 22 && py < 32) loc = "🛍️ T. Nagar Market";
  else if(px > 40 && px < 52 && py > 42 && py < 50) loc = "🚉 Central Station";
  else if(px > 8 && px < 18 && py > 35 && py < 45) loc = "🌳 City Park";
  else if(map[py][px] === TILES.TEASTALL) loc = "☕ Tea Stall";
  
  if(loc !== currentLocation) {
    currentLocation = loc;
    let label = document.getElementById('location-label');
    if(loc) {
      label.textContent = loc;
      label.style.opacity = 1;
      setTimeout(() => label.style.opacity = 0, 3000);
      if(loc.includes("Beach") && !quests.find(q=>q.id==="beach_walk").completed) completeQuest("beach_walk");
      if(loc.includes("Temple") && !quests.find(q=>q.id==="temple_prayer").completed) completeQuest("temple_prayer");
      if(loc.includes("Market") && !quests.find(q=>q.id==="market_visit").completed) completeQuest("market_visit");
      if(loc.includes("Park") && !quests.find(q=>q.id==="park_visit").completed) completeQuest("park_visit");
      if(loc.includes("Station") && !quests.find(q=>q.id==="station_visit").completed) completeQuest("station_visit");
      if(loc.includes("Tea") && !quests.find(q=>q.id==="first_coffee").completed) completeQuest("first_coffee");
    }
  }
  
  for(let i=items.length-1; i>=0; i--) {
    let item = items[i];
    let dist = Math.hypot(player.x - item.x, player.y - item.y);
    if(dist < TILE_SIZE) {
      inventory[item.nameEn] = (inventory[item.nameEn] || 0) + 1;
      showNotification("Got " + item.icon + " " + item.nameEn + "!");
      items.splice(i, 1);
      createParticles(item.x, item.y, '#FFD700');
    }
  }
  
  particles = particles.filter(p => p.life > 0);
  particles.forEach(p => { p.x += p.vx; p.y += p.vy; p.life -= 0.02; p.vy += 0.1; });
  updateUI();
}

function completeQuest(qid) {
  let q = quests.find(q => q.id === qid);
  if(q && !q.completed) {
    q.completed = true;
    money += q.reward;
    showNotification("✅ Quest Complete: " + q.title + "! +₹" + q.reward);
    createParticles(player.x, player.y, '#FFD700');
  }
}

function showNotification(text) {
  let notif = document.getElementById('notification');
  notif.textContent = text;
  notif.style.display = 'block';
  notif.style.animation = 'none';
  notif.offsetHeight;
  notif.style.animation = 'fadeInOut 2s';
  setTimeout(() => notif.style.display = 'none', 2000);
}

function createParticles(x, y, color) {
  for(let i=0; i<8; i++) {
    particles.push({ x: x, y: y, vx: (Math.random()-0.5)*4, vy: (Math.random()-0.5)*4 - 2, life: 1, color: color });
  }
}

function draw() {
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.save();
  ctx.translate(-camera.x, -camera.y);
  
  let startX = Math.floor(camera.x / TILE_SIZE);
  let startY = Math.floor(camera.y / TILE_SIZE);
  let endX = startX + Math.ceil(canvas.width / TILE_SIZE) + 1;
  let endY = startY + Math.ceil(canvas.height / TILE_SIZE) + 1;
  
  for(let y=startY; y<=endY; y++) {
    for(let x=startX; x<=endX; x++) {
      if(y>=0 && y<MAP_H && x>=0 && x<MAP_W) {
        let tile = map[y][x];
        let px = x * TILE_SIZE;
        let py = y * TILE_SIZE;
        ctx.fillStyle = COLORS[tile] || '#333';
        ctx.fillRect(px, py, TILE_SIZE, TILE_SIZE);
        ctx.strokeStyle = 'rgba(0,0,0,0.1)';
        ctx.strokeRect(px, py, TILE_SIZE, TILE_SIZE);
        
        if(tile === TILES.TEMPLE) { ctx.fillStyle = '#FFD700'; ctx.fillRect(px+5, py+5, TILE_SIZE-10, 5); }
        if(tile === TILES.TEASTALL) { ctx.fillStyle = '#8B4513'; ctx.fillRect(px+10, py+10, TILE_SIZE-20, TILE_SIZE-20); ctx.fillStyle = '#fff'; ctx.font = '20px Arial'; ctx.fillText('☕', px+8, py+32); }
        if(tile === TILES.TREE) { ctx.fillStyle = '#228B22'; ctx.beginPath(); ctx.arc(px+TILE_SIZE/2, py+TILE_SIZE/2, TILE_SIZE/3, 0, Math.PI*2); ctx.fill(); ctx.fillStyle = '#8B4513'; ctx.fillRect(px+TILE_SIZE/2-3, py+TILE_SIZE/2, 6, TILE_SIZE/2); }
        if(tile === TILES.WATER) { ctx.fillStyle = 'rgba(255,255,255,0.1)'; ctx.fillRect(px + (gameTime%10), py+10, 10, 2); }
        if(tile === TILES.MARKET) { ctx.fillStyle = '#FF6347'; ctx.fillRect(px+5, py+25, TILE_SIZE-10, 15); ctx.fillStyle = '#FFD700'; ctx.fillRect(px+15, py+5, 5, 20); }
        if(tile === TILES.STATION) { ctx.fillStyle = '#444'; ctx.fillRect(px+5, py+5, TILE_SIZE-10, TILE_SIZE-10); ctx.fillStyle = '#fff'; ctx.font = '12px Arial'; ctx.fillText('🚂', px+10, py+28); }
      }
    }
  }
  
  items.forEach(item => {
    ctx.font = '24px Arial';
    ctx.fillText(item.icon, item.x + 8, item.y + 32);
  });
  
  npcs.forEach(npc => {
    ctx.fillStyle = 'rgba(0,0,0,0.3)';
    ctx.beginPath();
    ctx.ellipse(npc.x+TILE_SIZE/2, npc.y+TILE_SIZE-5, 15, 5, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = npc.color;
    ctx.beginPath();
    ctx.arc(npc.x+TILE_SIZE/2, npc.y+TILE_SIZE/2, 14, 0, Math.PI*2);
    ctx.fill();
    ctx.font = '22px Arial';
    ctx.fillText(npc.sprite, npc.x+8, npc.y+30);
    ctx.fillStyle = 'rgba(0,0,0,0.7)';
    let nameText = npc.name.split(' ')[0];
    ctx.fillRect(npc.x - 10, npc.y - 18, ctx.measureText(nameText).width + 20, 18);
    ctx.fillStyle = '#FFD700';
    ctx.font = '10px Arial';
    ctx.fillText(nameText, npc.x, npc.y - 5);
    let dist = Math.hypot(player.x - npc.x, player.y - npc.y);
    if(dist < TILE_SIZE * 1.5) { ctx.fillStyle = '#e94560'; ctx.font = 'bold 14px Arial'; ctx.fillText('E', npc.x+18, npc.y-25); }
  });
  
  let px = player.x + TILE_SIZE/2;
  let py = player.y + TILE_SIZE/2;
  ctx.fillStyle = 'rgba(0,0,0,0.3)';
  ctx.beginPath();
  ctx.ellipse(px, py+18, 12, 4, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#e94560';
  ctx.beginPath();
  ctx.arc(px, py, 12, 0, Math.PI*2);
  ctx.fill();
  ctx.fillStyle = '#fff';
  let dirX = 0, dirY = 0;
  if(player.dir === 'up') dirY = -6;
  if(player.dir === 'down') dirY = 6;
  if(player.dir === 'left') dirX = -6;
  if(player.dir === 'right') dirX = 6;
  ctx.beginPath();
  ctx.arc(px+dirX, py+dirY, 4, 0, Math.PI*2);
  ctx.fill();
  
  if(player.moving) {
    ctx.strokeStyle = '#e94560';
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(px-5, py+12);
    ctx.lineTo(px-8 + Math.sin(player.frame)*5, py+20);
    ctx.moveTo(px+5, py+12);
    ctx.lineTo(px+8 - Math.sin(player.frame)*5, py+20);
    ctx.stroke();
  }
  
  particles.forEach(p => {
    ctx.fillStyle = p.color;
    ctx.globalAlpha = p.life;
    ctx.fillRect(p.x, p.y, 4, 4);
    ctx.globalAlpha = 1;
  });
  
  ctx.restore();
  
  let hour = gameTime / 60;
  let darkness = 0;
  if(hour < 6) darkness = 0.6 - hour * 0.1;
  else if(hour > 18) darkness = (hour - 18) * 0.1;
  else if(hour > 20) darkness = 0.6;
  
  if(darkness > 0) {
    ctx.fillStyle = 'rgba(10, 10, 40, ' + darkness + ')';
    ctx.fillRect(0, 0, canvas.width, canvas.height);
    let screenPx = player.x - camera.x + TILE_SIZE/2;
    let screenPy = player.y - camera.y + TILE_SIZE/2;
    let gradient = ctx.createRadialGradient(screenPx, screenPy, 10, screenPx, screenPy, 80);
    gradient.addColorStop(0, 'rgba(255, 200, 100, 0.3)');
    gradient.addColorStop(1, 'rgba(255, 200, 100, 0)');
    ctx.fillStyle = gradient;
    ctx.fillRect(0, 0, canvas.width, canvas.height);
  }
}

function updateUI() {
  let hour = Math.floor(gameTime / 60);
  let min = Math.floor(gameTime % 60);
  let period = hour < 12 ? "காலை" : hour < 16 ? "மதியம்" : hour < 19 ? "மாலை" : "இரவு";
  let icon = hour < 6 || hour > 18 ? "🌙" : "☀️";
  document.getElementById('time-display').textContent = icon + " " + period + " " + hour + ":" + min.toString().padStart(2,'0');
  document.getElementById('money').textContent = money;
  document.getElementById('energy').textContent = Math.floor(energy);
}

function toggleQuests() {
  let panel = document.getElementById('quest-panel');
  let list = document.getElementById('quest-list');
  if(panel.style.display === 'block') { panel.style.display = 'none'; }
  else {
    panel.style.display = 'block';
    document.getElementById('inv-panel').style.display = 'none';
    list.innerHTML = quests.map(q => '<div style="padding: 8px; margin-bottom: 5px; background: ' + (q.completed ? 'rgba(0,255,0,0.1)' : 'rgba(255,255,255,0.05)') + '; border-radius: 6px; border-left: 3px solid ' + (q.completed ? '#90EE90' : '#e94560') + ';"><div style="font-weight: bold; font-size: 13px;">' + (q.completed ? '✅' : '⬜') + ' ' + q.title + '</div><div style="font-size: 11px; color: #aaa;">' + q.desc + '</div><div style="font-size: 11px; color: #ffd700;">Reward: ₹' + q.reward + '</div></div>').join('');
  }
}

function toggleInventory() {
  let panel = document.getElementById('inv-panel');
  let list = document.getElementById('inv-list');
  if(panel.style.display === 'block') { panel.style.display = 'none'; }
  else {
    panel.style.display = 'block';
    document.getElementById('quest-panel').style.display = 'none';
    let invItems = Object.entries(inventory);
    list.innerHTML = invItems.length === 0 ? '<div style="color: #666; text-align: center; padding: 20px;">Empty</div>' : invItems.map(([name, count]) => '<div style="padding: 5px; border-bottom: 1px solid #333;">• ' + name + ': ' + count + '</div>').join('');
  }
}

function doAction() {
  if(inDialog) { advanceDialog(); return; }
  for(let npc of npcs) {
    let dist = Math.hypot(player.x - npc.x, player.y - npc.y);
    if(dist < TILE_SIZE * 1.5) { startDialog(npc); return; }
  }
}

function startDialog(npc) {
  inDialog = true;
  dialogQueue = [...npc.dialog];
  advanceDialog();
}

function advanceDialog() {
  if(dialogQueue.length === 0) {
    inDialog = false;
    document.getElementById('dialog-box').style.display = 'none';
    return;
  }
  let line = dialogQueue.shift();
  document.getElementById('dialog-box').style.display = 'block';
  document.getElementById('dialog-speaker').textContent = "👤 Character";
  document.getElementById('dialog-text').textContent = line.text;
  document.getElementById('dialog-translation').textContent = line.trans ? '"' + line.trans + '"' : "";
}

function gameLoop() {
  update();
  draw();
  requestAnimationFrame(gameLoop);
}

function startGame() {
  document.getElementById('start-screen').style.display = 'none';
  generateMap();
  createNPCs();
  createItems();
  initQuests();
  gameRunning = true;
  gameLoop();
}
</script>
